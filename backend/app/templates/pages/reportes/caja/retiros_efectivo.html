{# Reporte de Caja: retiros de efectivo del día. #}
{% extends "pages/reportes/caja/_base.html" %}
{% import "pages/reportes/caja/_clases.html" as c %}

{% block tabla %}
<thead>
    <tr>
        <th class="{{ c.th }} pl-8">Hora</th>
        <th class="{{ c.th }}">Local</th>
        <th class="{{ c.th }}">Retiró</th>
        <th class="{{ c.th }}">Registró</th>
        <th class="{{ c.th_monto }} pr-8">Monto</th>
    </tr>
</thead>
<tbody>
    <template x-for="r in datos.filas" :key="r.id">
        <tr class="{{ c.fila }}">
            <td class="{{ c.td }} pl-8 whitespace-nowrap" x-text="hora(r.timestamp)"></td>
            <td class="{{ c.td }}" x-text="r.punto_de_venta_nombre"></td>
            <td class="{{ c.td }} font-medium" x-text="r.usuario_nombre"></td>
            <td class="{{ c.td }} text-sm text-texto-muted" x-text="r.registrado_por_nombre"></td>
            <td class="{{ c.td_monto }} pr-8 font-medium" x-text="pesos(r.monto)"></td>
        </tr>
    </template>
</tbody>
<tfoot>
    <tr x-show="datos.filas.length" class="{{ c.fila_subtotal }}">
        <td colspan="4" class="{{ c.td }} pl-8">Total</td>
        <td class="{{ c.td_monto }} pr-8" x-text="pesos(datos.total)"></td>
    </tr>
    <tr x-show="!datos.filas.length">
        <td colspan="5" class="px-8 py-16 text-center text-texto-muted">Sin retiros ese día.</td>
    </tr>
</tfoot>
{% endblock %}
