{# Reporte de Caja: cobros de joyero del día, con totales por medio. #}
{% extends "pages/reportes/caja/_base.html" %}
{% import "pages/reportes/caja/_clases.html" as c %}

{% block tabla %}
<thead>
    <tr>
        <th class="{{ c.th }} pl-8">Hora</th>
        <th class="{{ c.th }}">Local</th>
        <th class="{{ c.th }}">Vendedora</th>
        <th class="{{ c.th }}">N° reclamo</th>
        <th class="{{ c.th }}">Medio de pago</th>
        <th class="{{ c.th_monto }} pr-8">Monto</th>
    </tr>
</thead>
<tbody>
    <template x-for="cobro in datos.filas" :key="cobro.id">
        <tr class="{{ c.fila }}">
            <td class="{{ c.td }} pl-8 whitespace-nowrap" x-text="hora(cobro.timestamp)"></td>
            <td class="{{ c.td }}" x-text="cobro.punto_de_venta_nombre"></td>
            <td class="{{ c.td }} font-medium" x-text="cobro.vendedora_nombre"></td>
            <td class="{{ c.td }} font-mono text-sm" x-text="cobro.numero_reclamo || '—'"></td>
            <td class="{{ c.td }}" x-text="cobro.medio_de_pago"></td>
            <td class="{{ c.td_monto }} pr-8 font-medium" x-text="pesos(cobro.monto)"></td>
        </tr>
    </template>
</tbody>
<tfoot>
    <template x-for="tm in datos.totales_por_medio" :key="tm.medio_de_pago">
        <tr class="border-t border-borde bg-surface-alt">
            <td colspan="5" class="{{ c.td }} pl-8 text-sm" x-text="'Total ' + tm.medio_de_pago"></td>
            <td class="{{ c.td_monto }} pr-8" x-text="pesos(tm.monto)"></td>
        </tr>
    </template>
    <tr x-show="datos.filas.length" class="{{ c.fila_subtotal }}">
        <td colspan="5" class="{{ c.td }} pl-8">Total</td>
        <td class="{{ c.td_monto }} pr-8" x-text="pesos(datos.total)"></td>
    </tr>
    <tr x-show="!datos.filas.length">
        <td colspan="6" class="px-8 py-16 text-center text-texto-muted">Sin cobros de joyero ese día.</td>
    </tr>
</tfoot>
{% endblock %}
