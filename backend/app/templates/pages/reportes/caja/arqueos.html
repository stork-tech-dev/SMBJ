{# Reporte de Caja: arqueos, sistema vs contado por medio. Diferencias en rojo. #}
{% extends "pages/reportes/caja/_base.html" %}
{% import "pages/reportes/caja/_clases.html" as c %}

{% block tabla %}
<thead>
    <tr>
        <th rowspan="2" class="{{ c.th }} pl-8 align-bottom">Turno</th>
        <template x-for="col in datos.columnas" :key="col">
            <th colspan="3" class="px-4 pt-8 pb-1 text-center text-base font-semibold text-texto-header
                                   border-l border-borde whitespace-nowrap" x-text="col"></th>
        </template>
        <th colspan="3" class="px-4 pt-8 pb-1 pr-8 text-center text-base font-semibold text-texto-header
                               border-l border-borde">Total</th>
    </tr>
    <tr>
        <template x-for="col in [...datos.columnas, '__total']" :key="col">
            <th colspan="3" class="p-0 border-l border-borde">
                <div class="grid grid-cols-3 text-xs font-semibold text-texto-disabled">
                    <span class="px-3 pb-4 text-right">Sistema</span>
                    <span class="px-3 pb-4 text-right">Contado</span>
                    <span class="px-3 pb-4 text-right">Dif.</span>
                </div>
            </th>
        </template>
    </tr>
</thead>
<tbody>
    <template x-for="f in datos.filas" :key="f.arqueo_id">
        <tr class="{{ c.fila }}">
            <td class="{{ c.td }} pl-8">
                <span class="font-medium whitespace-nowrap" x-text="rangoTurno(f)"></span>
                <span class="block text-xs text-texto-muted" x-text="'Cerró ' + f.usuario_nombre"></span>
            </td>
            <template x-for="col in datos.columnas" :key="col">
                <td colspan="3" class="p-0 border-l border-borde">
                    <div class="grid grid-cols-3 text-sm tabular-nums whitespace-nowrap"
                         x-data="{ i: itemDe(f, col) }">
                        <span class="px-3 py-3 text-right" x-text="i ? pesos(i.monto_esperado) : '—'"></span>
                        <span class="px-3 py-3 text-right" x-text="i ? pesos(i.monto_declarado) : '—'"></span>
                        <span class="px-3 py-3 text-right font-semibold"
                              :class="i && !esCero(i.diferencia) ? 'text-danger' : 'text-texto-muted'"
                              x-text="i ? pesos(i.diferencia) : '—'"></span>
                    </div>
                </td>
            </template>
            <td colspan="3" class="p-0 pr-4 border-l border-borde">
                <div class="grid grid-cols-3 text-sm tabular-nums font-semibold whitespace-nowrap">
                    <span class="px-3 py-3 text-right" x-text="pesos(f.total_esperado)"></span>
                    <span class="px-3 py-3 text-right" x-text="pesos(f.total_declarado)"></span>
                    <span class="px-3 py-3 text-right"
                          :class="esCero(f.diferencia) ? 'text-texto-muted' : 'text-danger'"
                          x-text="pesos(f.diferencia)"></span>
                </div>
            </td>
        </tr>
    </template>
    <tr x-show="!datos.filas.length">
        <td :colspan="1 + 3 * (datos.columnas.length + 1)" class="px-8 py-16 text-center text-texto-muted">
            Sin arqueos ese día.
        </td>
    </tr>
</tbody>
{% endblock %}
